<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>
</head>
<body>
<h2>Student Management System</h2>

<form th:action="@{/students}" method="post">
    <label>ID:</label>
    <input type="number" name="id" required />

    <label>Name:</label>
    <input type="text" name="name" required />

    <label>CGPA:</label>
    <input type="number" step="0.01" name="cgpa" required />

    <button type="submit">Add Student</button>
</form>

<br>

<table border="1">
    <thead>
    <tr>
        <th>Student ID</th>
        <th>Name</th>
        <th>CGPA</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.cgpa}"></td>
        <td>
            <a th:href="@{'/students/edit/' + ${student.id}}">Update</a>

            <form th:action="@{'/students/delete/' + ${student.id}}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Are you sure?')">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
