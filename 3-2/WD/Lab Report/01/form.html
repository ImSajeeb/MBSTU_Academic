<!DOCTYPE html>
<html>

<body>

    <h1 align="center">Input Form (IT-23032)</h1>

    <form align="center">

        First Name:
        <input type="text" name="firstname">

        Last Name:
        <input type="text" name="lastname">
        <br><br>

        User Name:
        <input type="text" name="user">

        Password:
        <input type="text" name="password">
        <br><br>

        <b>Gender</b>

        <input type="radio" name="gender" value="male"> Male

        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <b>Religion</b>

        <input type="radio" name="religion" value="muslim"> Muslim

        <input type="radio" name="religion" value="others"> Others
        <br><br>

        <b>IT Expert</b>

        <input type="checkbox" name="expert" value="hardware">
        Hardware Expert

        <input type="checkbox" name="expert" value="software">
        Software Expert

        <input type="checkbox" name="expert" value="graphic">
        Graphic Designer

        <input type="checkbox" name="expert" value="network">
        Network Expert
        <br><br>

        <b>Select Department</b>

        <select name="department">
            <option>CIS</option>
            <option>SWE</option>
            <option>EEE</option>
            <option>CSE</option>
        </select>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
